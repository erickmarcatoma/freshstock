<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshStock - Priority Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>FreshStock 📦⚡</h1>
      <p>Automated Inventory Risk Management for FreshRoute</p>
    </header>

    <!-- 1. Clickable Summary Metrics -->
    <div id="metrics-bar" class="metrics-bar"></div>

    <!-- 2. Bulk CSV File Upload Section -->
    <section class="upload-section">
      <h2>Bulk Import Inventory</h2>
      <div id="drop-zone" class="drop-zone">
        <span class="drop-icon">📁</span>
        <p>Drag & drop your inventory <strong>.csv</strong> file here, or <label for="csv-file-input" class="file-label">browse</label></p>
        <input type="file" id="csv-file-input" accept=".csv" class="file-input">
      </div>
      <p class="upload-hint">Expected columns: <code>name, quantity, minQuantity, expirationDate</code> (YYYY-MM-DD)</p>
    </section>

    <!-- 3. Add Single Item Form -->
    <section class="form-section">
      <h2>Add New Inventory Item</h2>
      <form id="add-item-form" class="item-form">
        <input type="text" id="item-name" placeholder="Item Name (e.g. Whole Milk)" required>
        <input type="number" id="item-qty" placeholder="Current Qty" min="0" required>
        <input type="number" id="item-min" placeholder="Min Qty" min="0" required>
        <input type="date" id="item-exp" required>
        <button type="submit" class="add-btn">+ Add Item</button>
      </form>
    </section>

    <!-- 4. Dynamic Priority Dashboard -->
    <main id="dashboard" class="dashboard"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
